services:
  mysql:
    image: mysql:8.4
    container_name: fitness_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fitness_club
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fitness_user", "-pfitness_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8
    container_name: fitness_mongodb
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: ./app
    container_name: fitness_app
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fitness_club
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_pass
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DATABASE: fitness_club_nosql
    command: ["python", "main.py"]

volumes:
  mysql_data:
  mongo_data: